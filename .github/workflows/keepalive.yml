# Ping harian ke Supabase supaya proyek gratis tidak dijeda karena tidak ada aktivitas (7 hari).
# Memanggil fungsi publik public_schools (membaca tabel sekolah), jadi benar-benar menyentuh database.
# Kunci di bawah adalah kunci publik yang sama dengan assets/js/config.js, bukan rahasia.
# Bila panggilan gagal, job ditandai gagal dan GitHub mengirim email pemberitahuan.
name: Ping Supabase

on:
  schedule:
    - cron: "17 3 * * *"   # tiap hari 03.17 UTC (10.17 WIB)
  workflow_dispatch:        # bisa dijalankan manual dari tab Actions

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Panggil database
        env:
          URL: https://okpokhawqjdlqpmstwxl.supabase.co
          KEY: sb_publishable_iwKS0K0-f75qd03NnBbPCg_JiB3JmF9
        run: |
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" --retry 3 --retry-delay 10 --max-time 30 \
            -X POST "$URL/rest/v1/rpc/public_schools" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Supabase tidak menjawab dengan benar (HTTP $code). Proyek mungkin dijeda: buka dasbor Supabase lalu Restore project."
            exit 1
          fi
          echo "Database aktif."
